<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — PhotoStudio</title>
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head><body>
<div th:replace="fragments/header :: site-header"></div>
<section class="page-section">
  <h1>Your Cart</h1>
  <div th:if="${#lists.isEmpty(cartItems)}">Cart is empty. <a th:href="@{/gallery}" class="btn">Go to Gallery</a></div>
  <table th:if="${!#lists.isEmpty(cartItems)}" class="cart-table">
    <tr><th>Photo</th><th>Name</th><th>Price</th><th></th></tr>
    <tr th:each="p : ${cartItems}">
      <td><img th:src="${p.previewUrl}" alt="" class="thumb-sm"></td>
      <td th:text="${p.name}"></td>
      <td>₹<span th:text="${p.price}"></span></td>
      <td>
        <form th:action="@{'/cart/remove/' + ${p.id}}" method="post">
          <button class="btn danger">Remove</button>
        </form>
      </td>
    </tr>
  </table>
  <div class="total" th:if="${!#lists.isEmpty(cartItems)}">
    <p><strong>Total: ₹<span th:text="${total}"></span></strong></p>
    <a th:href="@{/checkout}" class="btn">Proceed to Checkout</a>
  </div>
</section>
<div th:replace="fragments/footer :: site-footer"></div>
</body></html>
