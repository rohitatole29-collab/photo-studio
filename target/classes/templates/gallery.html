<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — PhotoStudio</title>
  <link th:href="@{/css/style.css}" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 40px;
      background: linear-gradient(135deg, #1a1a1a, #111);
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 40px 20px;
    }

    .card {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 25px rgba(140,82,255,0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-bottom: 2px solid #8c52ff;
    }

    .card-content {
      padding: 15px;
      text-align: center;
    }

    .card-content h3 {
      margin: 10px 0;
      font-size: 20px;
      color: #fff;
    }

    .card-content p {
      margin: 5px 0 10px;
      color: #ccc;
      font-size: 16px;
    }

    button {
      background-color: #8c52ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #732efc;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 26px; }
      .hero p { font-size: 15px; }
      .card img { height: 200px; }
    }
  </style>
</head>

<body>
  <!-- ✅ Header -->
  <div th:replace="fragments/header :: site-header"></div>

  <!-- ✅ Hero Section -->
  <section class="hero">
    <h1>Explore Our Stunning Photography Collection</h1>
    <p>Add photos to your cart and unlock downloads after payment.</p>
  </section>

  <!-- ✅ Gallery Section -->
  <section class="gallery-grid">
    <div th:each="photo : ${photos}" class="card">
      <img th:src="@{${photo.previewUrl}}" th:alt="${photo.name}">
      <div class="card-content">
        <h3 th:text="${photo.name}"></h3>
        <p>₹<span th:text="${photo.price}"></span></p>
        <form th:action="@{'/cart/add/' + ${photo.id}}" method="post">
          <button type="submit">Add to Cart</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ✅ Footer -->
  <div th:replace="fragments/footer :: site-footer"></div>
</body>
</html>
