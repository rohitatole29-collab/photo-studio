<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — PhotoStudio</title>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<div th:replace="fragments/header :: site-header"></div>
<section class="page-section">
  <h1>Complete Your Payment</h1>
  <p>Total Amount: ₹<span th:text="${total}"></span></p>
  <form id="paymentForm" onsubmit="return false;">
    <input type="email" id="email" placeholder="Enter your email" required>
    <button type="button" onclick="startPayment()">Pay Now</button>
  </form>
</section>
<script>
async function startPayment() {
  const amount = [[${total}]];
  const email = document.getElementById('email').value;
  if (!email) { alert('Please enter email'); return; }
  const res = await fetch('/checkout/createOrder?amount=' + amount, { method: 'POST' });
  const data = await res.json();
  const options = {
    key: '[[${@environment.getProperty("razorpay.key_id")}]]',
    amount: data.amount,
    currency: 'INR',
    name: 'PhotoStudio',
    description: 'Image Purchase',
    order_id: data.id,
    handler: function (resp) {
      const body = new URLSearchParams({
        email: email,
        razorpayOrderId: resp.razorpay_order_id,
        razorpayPaymentId: resp.razorpay_payment_id,
        razorpaySignature: resp.razorpay_signature
      });
      fetch('/checkout/success', {
        method: 'POST',
        headers: {'Content-Type':'application/x-www-form-urlencoded'},
        body
      }).then(() => window.location.href = '/download');
    },
    theme: { color: '#8c52ff' }
  };
  const rzp1 = new Razorpay(options);
  rzp1.open();
}
</script>
<div th:replace="fragments/footer :: site-footer"></div>
</body>
</html>
