<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — PhotoStudio</title>
  <link th:href="@{/css/style.css}" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }

    section.page-section {
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: #fff;
      margin-bottom: 40px;
    }

    /* ✅ Responsive Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }

    .card {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 30px rgba(140, 82, 255, 0.4);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-bottom: 2px solid #8c52ff;
    }

    .card-content {
      padding: 15px 10px;
    }

    .card-content h3 {
      margin: 0;
      font-size: 20px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ✅ Mobile optimization */
    @media (max-width: 600px) {
      .card img {
        height: 200px;
      }
      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <!-- ✅ Header -->
  <div th:replace="fragments/header :: site-header"></div>

  <!-- ✅ Portfolio Section -->
  <section class="page-section">
    <h1>Our Portfolio</h1>

    <div class="gallery-grid">
      <div class="card">
        <img th:src="@{/images/images134.jpg}" alt="Wedding Photography">
        <div class="card-content"><h3>Wedding</h3></div>
      </div>

      <div class="card">
        <img th:src="@{/images/images136.jpg}" alt="Fashion Photography">
        <div class="card-content"><h3>Fashion</h3></div>
      </div>

      <div class="card">
        <img th:src="@{/images/images144.jpg}" alt="Event Photography">
        <div class="card-content"><h3>Events</h3></div>
      </div>
    </div>
  </section>

  <!-- ✅ Footer -->
  <div th:replace="fragments/footer :: site-footer"></div>
</body>
</html>
