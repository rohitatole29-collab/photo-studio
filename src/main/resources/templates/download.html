<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads — PhotoStudio</title>
  <link th:href="@{/css/style.css}" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
    }

    section.page-section {
      padding: 60px 20px 80px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 40px;
    }

    /* ✅ Grid Layout */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      justify-content: center;
      align-items: start;
      padding: 0 20px;
    }

    .card {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 25px rgba(140, 82, 255, 0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-bottom: 2px solid #8c52ff;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      font-size: 20px;
      margin: 10px 0;
      color: #fff;
    }

    .download-btn {
      display: inline-block;
      margin-top: 10px;
      background: #8c52ff;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      transition: background 0.3s ease;
    }

    .download-btn:hover {
      background: #732efc;
    }

    @media (max-width: 600px) {
      h1 { font-size: 26px; }
      p { font-size: 15px; }
      .card img { height: 200px; }
    }
  </style>
</head>

<body>
  <!-- ✅ Header -->
  <div th:replace="fragments/header :: site-header"></div>

  <!-- ✅ Download Section -->
  <section class="page-section">
    <h1>Your Downloads</h1>
    <p>Thanks for your payment. Click below to download your full-resolution photos.</p>

    <div class="gallery-grid">
      <div th:each="photo : ${photos}" class="card">
        <img th:src="@{${photo.previewUrl}}" th:alt="${photo.name}">
        <div class="card-content">
          <h3 th:text="${photo.name}"></h3>
          <a th:href="@{'/file/' + ${photo.id}}" class="download-btn">Download Full Image</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ✅ Footer -->
  <div th:replace="fragments/footer :: site-footer"></div>
</body>
</html>
