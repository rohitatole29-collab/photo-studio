<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoStudio — Your Downloads</title>
<style>
body{margin:0;background:#0b0b0c;font-family:Arial,Helvetica,sans-serif;color:#e8e8ea}
.wrap{max-width:640px;margin:0 auto;background:#121215;border-radius:12px;overflow:hidden}
.brand{padding:24px 28px;background:#111018;border-bottom:1px solid #1e1d26;display:flex;align-items:center;gap:12px}
.brand img{height:36px}
.hero{padding:28px}.hero h2{margin:0 0 8px}.hero p{margin:0;color:#b9b9c3}
.box{margin:12px 28px 20px;padding:16px;background:#1a1a22;border:1px solid #242236;border-radius:10px}
.kv{display:flex;justify-content:space-between;margin:4px 0;color:#cfcfda}
.grid{padding:0 28px 28px}.card{background:#14141b;border:1px solid #222131;border-radius:12px;padding:16px;margin-bottom:14px}
.thumb{width:84px;height:64px;border-radius:8px;object-fit:cover;border:1px solid #25243a}
.btn{display:inline-block;margin-top:10px;background:#8c52ff;color:#fff !important;text-decoration:none;padding:10px 14px;border-radius:8px;font-weight:600}
.footer{text-align:center;color:#7f7f8f;font-size:12px;padding:18px}
</style></head>
<body>
<div class="wrap">
  <div class="brand"><img th:src="@{/images/logo.png}" alt="PhotoStudio"><h1 style="font-size:16px;margin:0;color:#fff">PhotoStudio — Order Confirmed</h1></div>
  <div class="hero">
    <h2 th:text="'Thanks for your purchase, ' + ${customerName} + '!'">Thanks for your purchase!</h2>
    <p>Here are your full-resolution photo downloads.</p>
  </div>
  <div class="box">
    <div class="kv"><span>Order ID</span><strong th:text="${orderId}">#1</strong></div>
    <div class="kv"><span>Status</span><strong>PAID</strong></div>
    <div class="kv"><span>Email</span><strong th:text="${email}">you@example.com</strong></div>
    <div class="kv"><span>Total</span><strong>₹<span th:text="${total}">0</span></strong></div>
  </div>
  <div class="grid" th:if="${photos}">
    <div class="card" th:each="p : ${photos}">
      <table><tr>
        <td><img class="thumb" th:src="${p.previewUrl}" th:alt="${p.name}"></td>
        <td style="padding-left:10px;">
          <div style="font-weight:bold;color:#fff" th:text="${p.name}">Photo Name</div>
          <div style="color:#a7a7b5">Price: ₹<span th:text="${p.price}">0</span></div>
          <div><a class="btn" th:href="@{'/file/' + ${p.id}}">Download</a></div>
        </td>
      </tr></table>
    </div>
  </div>
  <div class="footer">© <span th:text="${year}">2025</span> PhotoStudio</div>
</div>
</body></html>
